# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 3
blur_params_noise = 0
blur_params_brightness = 1
blur_params_contrast = 1
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 2
shadow_only_floating = 0
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=20
no_radius_when_single=0
focused_opacity=0.8
unfocused_opacity=0.7

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
tag_animation_type=slide
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=1000
animation_duration_close=800
animation_duration_focus=550

animation_curve_open=0.15, 1, 0.3, 1
animation_curve_move=0.15, 1, 0.3, 1
animation_curve_tag=0.15, 1, 0.3, 1

# animation_curve_open=0.46,1.0,0.29,1
# animation_curve_move=0.46,1.0,0.29,1
# animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=60s
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=0
rootcolor=0x201b14ff
bordercolor=0x4455ff
focuscolor=0x6677ffff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tgmix
tagrule=id:2,layout_name:tgmix
tagrule=id:3,layout_name:grid
tagrule=id:4,layout_name:grid
tagrule=id:5,layout_name:tgmix
tagrule=id:6,layout_name:tgmix
tagrule=id:7,layout_name:tgmix
tagrule=id:8,layout_name:tgmix
tagrule=id:9,layout_name:tgmix

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,Return,spawn,kitty
bind=SUPER,Backspace,spawn,wlogout -b 4
bind=SUPER,E,spawn,nautilus
bind=SUPER,T,spawn,kitty yazi

# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,W,toggleoverview,
bind=SUPER,backslash,togglefloating,
bind=ALT,m,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
default_layout = grid
bind=SUPER,n,switch_layout
bind=SUPER,s,switch_layout,scroller

# Volume Controls
bind = NONE, XF86AudioRaiseVolume, spawn, swayosd-client --output-volume raise
bind = CTRL+SHIFT,e, spawn, swayosd-client --output-volume raise

bind = NONE, XF86AudioLowerVolume, spawn, swayosd-client --output-volume lower
bind = CTRL+SHIFT,q, spawn, swayosd-client --output-volume lower

bind = NONE, XF86AudioMute, spawn, swayosd-client --output-volume mute-toggle
bind = CTRL,m, spawn, swayosd-client --output-volume mute-toggle

# Brightness Controls
bind = NONE, XF86MonBrightnessUp, spawn, swayosd-client --brightness raise
bind = CTRL+SHIFT,d, spawn, swayosd-client --brightness raise

bind = NONE, XF86MonBrightnessDown, spawn, swayosd-client --brightness lower
bind = CTRL+SHIFT,a, spawn, swayosd-client --brightness lower

# tag switch
bind=ALT,a,viewtoleft,0
#bind=CTRL,Left,viewtoleft_have_client,0
bind=ALT,d,viewtoright,0
#bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
gappih=20
gappiv=15
gappoh=20
gappov=10
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=SUPER+SHIFT,Up,movewin,+0,-50
bind=SUPER+SHIFT,Down,movewin,+0,+50
bind=SUPER+SHIFT,Left,movewin,-50,+0
ind=SUPER+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:slide,layer_name:rofi
layerrule=animation_type_close:slide,layer_name:rofi

#transparent apps
windowrule=kitty,0.8
windowrule=nautilus,0.8

bind=SUPER+ALT,B,spawn,helium --password-store=basic 
#web apps
bind=SUPER,Y,spawn,helium --password-store=basic --app=https://youtube.com
bind=SUPER+ALT,I,spawn,helium --password-store=basic --app=https://intranet.youcode.ma
bind=SUPER+ALT,A,spawn,helium --password-store=basic --app=https://gemini.google.com
bind=SUPER+ALT,G,spawn,helium --password-store=basic --app=https://github.com
bind=SUPER+ALT,M,spawn,helium --password-store=basic --app=https://mail.google.com
bind=SUPER+ALT,N,spawn,helium --password-store=basic --app=https://nepu.to
bind=SUPER+ALT,C,spawn,helium --password-store=basic --app=https://chatgpt.com

#autostart
exec-once= waybar
exec --no-startup-id /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh

#wallpapers
exec-once= swaybg -i /home/kaiser/.config/mango/wallpapers/ghibli.png

#live wallpaper
#exec-once=   mpvpaper -o "no-audio --loop" eDP-1  /home/kaiser/.config/mango/live-wallpapers/samurai-anime-boy-koi-in-sword-moewalls-com.mp4
bind = SUPER+SHIFT,w, exec, /home/kaiser/.config/mango/scripts/wallpaper-toggle.sh

exec-once = swayosd-libinput-backend
exec-once = swayosd-server
